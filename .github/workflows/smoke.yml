name: Smoke checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight audit dependencies
        run: python -m pip install numpy pandas

      - name: Compile source files
        run: python -m compileall -q core experiments scripts tests

      - name: Audit External Validation 20 manifest
        run: python scripts/audit_external_validation20.py

      - name: Run lightweight unit tests
        run: python -m unittest discover -s tests -v
